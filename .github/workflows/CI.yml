name: Python CI for Tasknest

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main



jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name : Run Tests
        run: |
          python -m unittest discover -s tests -v
      - name : Build Docker Image
        run: |
          docker build -t tasknest:latest .
        
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push to docker hub
        run: |
          docker tag tasknest:latest ${{ secrets.DOCKER_USERNAME }}/streamlit-todo-app:v1.0
          docker push ${{ secrets.DOCKER_USERNAME }}/streamlit-todo-app:v1.0

      
